<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1640"/>
      <stop offset="1" stop-color="#0b0f1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wisp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="stand" gradientUnits="userSpaceOnUse" x1="0" y1="250" x2="0" y2="410">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b7cf6"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- microphone capsule, shaped like a wisp flame (rounded body, curled tip) -->
  <path d="M256 92
           C 222 118, 206 140, 206 176
           L 206 262
           a 50 50 0 0 0 100 0
           L 306 176
           C 306 146, 292 128, 274 116
           C 280 132, 276 146, 264 152
           C 270 130, 266 108, 256 92 Z"
        fill="url(#wisp)"/>
  <!-- grille lines -->
  <g stroke="#0b0f1e" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round">
    <line x1="230" y1="206" x2="282" y2="206"/>
    <line x1="230" y1="236" x2="282" y2="236"/>
    <line x1="230" y1="266" x2="282" y2="266"/>
  </g>

  <!-- stand -->
  <g fill="none" stroke="url(#stand)" stroke-width="22" stroke-linecap="round">
    <path d="M162 256 a94 94 0 0 0 188 0"/>
    <line x1="256" y1="350" x2="256" y2="396"/>
    <line x1="206" y1="402" x2="306" y2="402"/>
  </g>

  <!-- sound waves -->
  <g fill="none" stroke="#5eead4" stroke-width="16" stroke-linecap="round">
    <path d="M118 196 q -26 56 0 112" stroke-opacity="0.85"/>
    <path d="M394 196 q 26 56 0 112" stroke-opacity="0.85"/>
    <path d="M80 168 q -42 84 0 168" stroke-opacity="0.4"/>
    <path d="M432 168 q 42 84 0 168" stroke-opacity="0.4"/>
  </g>
</svg>
